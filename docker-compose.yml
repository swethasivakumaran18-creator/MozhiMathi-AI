version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mozhi
      POSTGRES_PASSWORD: mozhi
      POSTGRES_DB: mozhi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_USER: mozhi
      DB_PASSWORD: mozhi
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mozhi
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
